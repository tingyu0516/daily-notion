[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-notion"
version = "0.1.0"
description = "Notion daily-plan MCP server for Hermes Agent: today's plan, postponement, supervision nudges, evening review"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    # <2.3: notion-client 2.3+ defaults to the 2025-09-03 data-source API where
    # databases.query/create no longer exist; this code targets the classic API.
    "notion-client>=2.2.1,<2.3",
]

[project.scripts]
daily-notion-server = "daily_notion.server:main"
daily-notion-setup = "daily_notion.setup:main"

[tool.setuptools]
packages = ["daily_notion"]
